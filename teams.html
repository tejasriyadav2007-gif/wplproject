<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams - WPL 2026</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6fb; text-align: center; }
    nav { background: #6a1b9a; padding: 15px; }
    nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
    header { background: #ba68c8; color: white; padding: 40px; }
  
.teams {
  padding: 40px 20px;
}

.team-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.team-card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  transition: transform 0.3s;
}

.team-card:hover {
  transform: scale(1.05);
}

.team-card img {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 50%;
   margin-bottom: 10px;
}
    footer { background: #6a1b9a; color: white; padding: 15px; margin-top: 20px; }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="teams.html">Teams</a>
  <a href="matches.html">Matches</a>
  <a href="gallery.html">Gallery</a>
</nav>

<header>
  <h1>WPL 2026 Teams</h1>
</header>

<div class="team-container">
  <div class="team-card">
    <img src="MI.jpg" alt="MI">
    <h3>Mumbai Indians</h3>
    <p><b>Captain:</b> Harmanpreet Kaur</p>
  </div>
  <div class="team-card">
    <h3>Royal Challengers</h3>
    <img src="RCB.jpg" alt="RCB">
    <p><b>Captain:</b> Smriti Mandhana</p>
  </div>
  <div class="team-card">
    <h3>Delhi Capitals</h3>
    <img src="Delhicap.jpg" alt="DC">
    <p><b>Captain:</b> Jemimah Rodrigues</p>
  </div>
</div>

<footer>© 2026 Women IPL | Student Project</footer>

</body>
</html>
