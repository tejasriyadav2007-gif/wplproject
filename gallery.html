<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - WPL 2026</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6fb; text-align: center; }
    nav { background: #6a1b9a; padding: 15px; }
    nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
    header { background: #ba68c8; color: white; padding: 40px; }
    .gallery-section { padding: 40px 20px; }
    .video-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
    .video-card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    iframe, video { width: 100%; height: 200px; border-radius: 8px; border: none; }
    footer { background: #6a1b9a; color: white; padding: 15px; margin-top: 40px; }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="teams.html">Teams</a>
  <a href="matches.html">Matches</a>
  <a href="gallery.html">Gallery</a>
</nav>

<header>
  <div class="hero-content">
  <h1>Media Gallery</h1>
 <p>Capturing the best moments of the 2026 Season</p>
    </div>
</header>
<section class="gallery">
  <h2>Photo Highlights</h2>
  <div class="gallery-container">
    <img src="women1.jpg" alt="Team Photo 1">
    <img src="women2.jpg" alt="Team Photo 2">
    <img src="women3.jpg" alt="Team Photo 3">
  </div>

  <h2 style="margin-top: 40px;">Video Highlights</h2>
  <div class="gallery-container">
    
    <div class="video-card">
      <video controls width="100%">
        <source src="wpl-highlights.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <div class="video-info">
        <p>Match Highlights</p>
      </div>
    </div>

    <div class="video-card">
      <iframe 
        src="https://www.youtube.com/embed/KkfzZG-MlF8" 
        title="WPL Final Highlights"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
      <div class="video-info">
        <p>Final Match (YouTube)</p>
      </div>
    </div>

    <div class="video-card">
      <video controls width="100%">
        <source src="wpl-auction.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <div class="video-info">
        <p>WPL Auction Video</p>
      </div>
    </div>

  </div>
</section>


<footer>© 2026 Women IPL | Student Project</footer>

</body>
</html>
