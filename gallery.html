<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - WPL 2026</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6fb; text-align: center; }
    nav { background: #6a1b9a; padding: 15px; }
    nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
    header { background: #ba68c8; color: white; padding: 40px; }
    .gallery-section { padding: 40px 20px; }
    .gallery-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  padding: 20px;
}
    .gallery-container img {
  width: 100%;
  height: 250px; 
   object-fit: cover;
  border-radius: 10px;
  transition: transform 0.3s;
}

.gallery-container img:hover {
  transform: scale(1.05);
}
    .video-card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  transition: transform 0.3s;
}

.video-card:hover {
  transform: scale(1.05);
}

.video-card video, 
.video-card iframe {
  width: 100%;
  height: 220px; /* Adjust height to match your images */
  display: block;
  border: none;
}

.video-info {
  padding: 10px;
  background: #fff;
  font-weight: bold;
  color: #6a1b9a;
}
    footer { background: #6a1b9a; color: white; padding: 15px; margin-top: 40px; }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="teams.html">Teams</a>
  <a href="matches.html">Matches</a>
  <a href="gallery.html">Gallery</a>
</nav>

<header>
  <div class="hero-content">
  <h1>Media Gallery</h1>
 <p>Capturing the best moments of the 2026 Season</p>
    </div>
</header>
<section class="gallery">
  <h2>Photo Highlights</h2>
  <div class="gallery-container">
    <img src="women1.jpg" alt="Team Photo 1">
    <img src="women2.jpg" alt="Team Photo 2">
    <img src="women3.jpg" alt="Team Photo 3">
  </div>

  <h2 style="margin-top: 40px;">Video Highlights</h2>
  <div class="gallery-container">
    
    <div class="video-card">
      <video controls width="100%">
        <source src="wpl-highlights.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <div class="video-info">
        <p>Match Highlights</p>
      </div>
    </div>

    <div class="video-card">
      <iframe 
        src="https://www.youtube.com/embed/KkfzZG-MlF8" 
        title="WPL Final Highlights"
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
      <div class="video-info">
        <p>Final Match (YouTube)</p>
      </div>
    </div>

    <div class="video-card">
      <video controls>
        <source src="wpl-auction.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <div class="video-info">
        <p>WPL Auction Video</p>
      </div>
    </div>

  </div>
</section>


<footer>© 2026 Women IPL | Student Project</footer>

</body>
</html>
